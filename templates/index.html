<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xy-graph-gen — Formula Grapher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f8fafc'/%3E%3Cpath d='M0 8h16M8 0v16' stroke='%23cbd5e1'/%3E%3Cpath d='M1 13L15 3' stroke='%232563eb' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc; --fg: #0f172a; --fg-soft: #334155; --muted: #64748b;
    --card: #ffffff; --border: #cbd5e1; --row-border: #f1f5f9;
    --hover: #f1f5f9; --chip-hover: #eef2ff; --input-focus: #bfdbfe;
    --error-fg: #b91c1c; --error-bg: #fef2f2; --error-border: #fecaca;
  }
  html[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --fg-soft: #cbd5e1; --muted: #94a3b8;
    --card: #1e293b; --border: #334155; --row-border: #1e293b;
    --hover: #243349; --chip-hover: #334155; --input-focus: #1e3a5f;
    --error-fg: #fca5a5; --error-bg: #450a0a; --error-border: #7f1d1d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Neucha", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .form input[type=text] {
    flex: 1; min-width: 240px; font-size: 16px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .form input[type=text]:focus { outline: 2px solid var(--input-focus); border-color: #2563eb; }
  .form button {
    padding: 10px 22px; font-size: 15px; font-weight: 600; font-family: inherit;
    background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .form button:hover { background: #1d4ed8; }
  .form input[type=number] {
    width: 88px; padding: 8px 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg);
    font-family: ui-monospace, Consolas, monospace;
  }
  .form input[type=number]:focus { outline: 2px solid var(--input-focus); border-color: #2563eb; }
  .range-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .range-label { color: var(--muted); font-size: 13px; }
  .btn-secondary {
    padding: 10px 14px; font-size: 14px; font-weight: 600; font-family: inherit;
    background: var(--card); color: var(--fg-soft); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .btn-secondary:hover { background: var(--hover); border-color: #94a3b8; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .chip {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); cursor: pointer; color: var(--fg-soft);
  }
  .chip:hover { background: var(--chip-hover); border-color: #818cf8; }
  #solved {
    font-size: 15px; margin: 0 0 12px; min-height: 22px;
    font-family: ui-monospace, Consolas, monospace; color: var(--fg);
  }
  #error {
    color: var(--error-fg); background: var(--error-bg); border: 1px solid var(--error-border);
    padding: 10px 14px; border-radius: 8px; margin: 0 0 12px; font-size: 14px; display: none;
  }
  .graphbox { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  canvas { width: 100%; height: auto; display: block; cursor: grab; touch-action: none; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .tablebox { margin-top: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tablebox h2 { font-size: 14px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--fg-soft); }
  .table-scroll { max-height: 220px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
  th, td { padding: 5px 14px; text-align: right; border-bottom: 1px solid var(--row-border); color: var(--fg); }
  th { position: sticky; top: 0; background: var(--bg); color: var(--muted); }
  tbody tr:nth-child(even) { background: var(--bg); }
  .branch-hdr td { text-align: left; font-weight: 600; background: var(--hover); color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>xy-graph-gen</h1>
    <p>Enter an equation in x and y — it is solved for y and plotted for x = 1 … 100, with (0,0) at the centre of the graph. Functions: <code>sin cos tan log sqrt exp abs</code> (+ <code>e</code>, <code>pi</code>). Drag to pan, scroll or pinch to zoom, double-click to reset.</p>
  </header>

  <form class="form" id="form">
    <input type="text" id="formula" value="{{ formula }}" spellcheck="false" autocomplete="off" placeholder="e.g. y = sin(x)">
    <div class="range-row" id="rangeRow">
      <span class="range-label">x:</span>
      <input type="number" id="xMin" value="{{ x_min }}" placeholder="auto" min="-100000" max="100000" step="1" title="x from (blank = auto)">
      <span class="range-label">to</span>
      <input type="number" id="xMax" value="{{ x_max }}" placeholder="auto" min="-100000" max="100000" step="1" title="x to (blank = auto)">
      <span class="range-label">step</span>
      <input type="number" id="xStep" value="{{ x_step }}" placeholder="auto" min="1" max="1000" step="1" title="x step (blank = 1)">
    </div>
    <button type="submit">Plot</button>
    <button type="button" class="btn-secondary" id="pngBtn" title="Download the graph as PNG">Download PNG</button>
    <button type="button" class="btn-secondary" id="copyBtn" title="Copy a shareable link to this graph">Copy link</button>
    <button type="button" class="btn-secondary" id="themeBtn" title="Toggle dark / light theme">🌙 Dark</button>
    <button type="button" class="btn-secondary" id="gridBtn" title="Toggle grid lines">Grid: on</button>
  </form>

  <div class="chips" id="chips">
    <button class="chip" type="button">x + y = 3</button>
    <button class="chip" type="button">y = 2x + 1</button>
    <button class="chip" type="button">2x + 3y = 6</button>
    <button class="chip" type="button">y = x^2 − 10x + 10</button>
    <button class="chip" type="button">x^2 + y^2 = 100</button>
    <button class="chip" type="button">y = sin(x)</button>
    <button class="chip" type="button">y = sqrt(x)</button>
    <button class="chip" type="button">y = e^x</button>
  </div>

  <div class="chips" id="history" style="display:none"></div>

  <p id="solved"></p>
  <div id="error"></div>

  <div class="graphbox">
    <canvas id="graph" width="900" height="640"></canvas>
    <div class="meta" id="meta"></div>
  </div>

  <div class="tablebox">
    <h2>Points</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>x</th><th>y</th></tr></thead>
        <tbody id="points"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
'use strict';

/* ================= parsing & solving (offline fallback) ================= */

function fmt(n) {
  if (Object.is(n, -0)) n = 0;
  if (Number.isInteger(n)) return String(n);
  return String(parseFloat(n.toPrecision(12)));
}

// Smallest "nice" number (1, 2, 5 × 10^k) that is >= v
function niceCeil(v) {
  if (!(v > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 5, 10]) {
    const c = m * mag;
    if (c >= v) return c;
  }
  return 10 * mag;
}

// Parse one term like "3", "-2x", "x^3", "y", "+0.5x"
function parseTerm(t) {
  const m = t.match(/^([+-]?)(\d*\.?\d*)?([xy]?)(?:\^(\d+))?$/);
  if (!m) return null;
  // NB: the optional coefficient group is `undefined` (not '') when it matches
  // empty (e.g. bare "x" or "y"), so treat falsy as an implicit 1.
  const cStr = m[2];
  let coeff = cStr ? parseFloat(cStr) : 1;
  if (!isFinite(coeff)) return null;
  if (m[1] === '-') coeff = -coeff;
  return { coeff: coeff, varName: m[3] || '', exp: m[4] ? parseInt(m[4], 10) : 1 };
}

// Split "2x-3y+5" into ["2x", "-3y", "+5"]
function tokenizeSide(s) {
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    let sign = '+';
    if (s[i] === '+' || s[i] === '-') { sign = s[i]; i++; }
    let j = i;
    while (j < s.length && s[j] !== '+' && s[j] !== '-') j++;
    if (j > i) {
      const body = s.slice(i, j).trim();
      if (body) tokens.push((sign === '-' ? '-' : '') + body);
    }
    i = j;
  }
  return tokens;
}

function parseSide(s) {
  const res = { xTerms: {}, yCoeff: 0, y2Coeff: 0, const: 0 };   // xTerms: exponent -> coefficient
  for (const t of tokenizeSide(s)) {
    const term = parseTerm(t);
    if (!term) return { error: 'Cannot understand term: "' + t + '"' };
    if (term.varName === 'x') {
      if (term.exp > 12) return { error: 'Exponent too large: "' + t + '" (max 12)' };
      res.xTerms[term.exp] = (res.xTerms[term.exp] || 0) + term.coeff;
    } else if (term.varName === 'y') {
      if (term.exp === 1) res.yCoeff += term.coeff;
      else if (term.exp === 2) res.y2Coeff += term.coeff;
      else return { error: 'Equation must be linear or quadratic in y: "' + t + '"' };
    } else {
      res.const += term.coeff;
    }
  }
  return res;
}

// Polynomial body like "−2x + 6", "100 − x²" or "0" (descending exponents)
function polyStr(poly) {
  const exps = Object.keys(poly).map(Number).sort((a, b) => b - a);
  const parts = [];
  for (const e of exps) {
    const c = poly[e], abs = Math.abs(c);
    let s;
    if (e === 0) s = fmt(abs);
    else if (e === 1) s = (abs === 1 ? '' : fmt(abs)) + 'x';
    else s = (abs === 1 ? '' : fmt(abs)) + 'x^' + e;
    if (parts.length === 0) s = (c < 0 ? '\u2212' : '') + s;
    else s = (c < 0 ? ' \u2212 ' : ' + ') + s;
    parts.push(s);
  }
  return parts.length ? parts.join('') : '0';
}

/* ================= expression path: functions, parens, e/pi =================
   Mirror of app/solver.py's expression solver. AST nodes:
   {t:'num',v} {t:'sym',n} {t:'x'} {t:'y'} {t:'neg',a} {t:'f',n,a}
   {t:'b',op,l,r} {t:'pow',l,r}.                                      */

const FUNCTIONS = ['sin', 'cos', 'tan', 'log', 'ln', 'sqrt', 'exp', 'abs'];
const FUNC_RE = /[()]|(?:sin|cos|tan|log|ln|sqrt|exp|abs)\(|(?<![a-zA-Z])e(?![a-zA-Z])|pi/;
const FUNCTION_Y_LIMIT = 1e6;

function exprValueEnd(tok) {
  return tok.t === 'num' || (tok.t === 'name' && (tok.n === 'x' || tok.n === 'y')) ||
         (tok.t === 'op' && tok.o === ')');
}
function exprValueStart(tok) {
  return tok.t === 'num' || tok.t === 'name' || (tok.t === 'op' && tok.o === '(');
}

// Tokenize an expression, inserting implicit '*' ("2x" -> "2*x").
function exprTokenize(s) {
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      const v = parseFloat(s.slice(i, j));
      if (!isFinite(v)) return { error: 'Cannot understand "' + s.slice(i, j) + '".' };
      tokens.push({ t: 'num', v: v });
      i = j;
      continue;
    }
    if (/[a-zA-Z]/.test(c)) {
      let j = i;
      while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
      tokens.push({ t: 'name', n: s.slice(i, j) });
      i = j;
      continue;
    }
    if ('+-*/^()'.indexOf(c) !== -1) { tokens.push({ t: 'op', o: c }); i++; continue; }
    return { error: 'Cannot understand character "' + c + '".' };
  }
  const out = [];
  for (let k = 0; k < tokens.length; k++) {
    out.push(tokens[k]);
    if (k < tokens.length - 1 && exprValueEnd(tokens[k]) && exprValueStart(tokens[k + 1])) {
      out.push({ t: 'op', o: '*' });
    }
  }
  return { tokens: out };
}

// Recursive descent: expr := term (('+'|'-') term)* ; term := unary
// (('*'|'/') unary)* ; unary := ('+'|'-') unary | power ;
// power := primary ('^' unary)?  (so "-x^2" == "-(x^2)").
function parseExprTokens(tokens) {
  let pos = 0;
  const peek = () => (pos < tokens.length ? tokens[pos] : null);
  const next = () => tokens[pos++];

  function expr() {
    let node = term();
    for (;;) {
      const t = peek();
      if (t && t.t === 'op' && (t.o === '+' || t.o === '-')) {
        next();
        node = { t: 'b', op: t.o, l: node, r: term() };
      } else return node;
    }
  }
  function term() {
    let node = unary();
    for (;;) {
      const t = peek();
      if (t && t.t === 'op' && (t.o === '*' || t.o === '/')) {
        next();
        node = { t: 'b', op: t.o, l: node, r: unary() };
      } else return node;
    }
  }
  function unary() {
    const t = peek();
    if (t && t.t === 'op' && t.o === '+') { next(); return unary(); }
    if (t && t.t === 'op' && t.o === '-') { next(); return { t: 'neg', a: unary() }; }
    return power();
  }
  function power() {
    const base = primary();
    const t = peek();
    if (t && t.t === 'op' && t.o === '^') { next(); return { t: 'pow', l: base, r: unary() }; }
    return base;
  }
  function primary() {
    const t = next();
    if (!t) throw new Error('Unexpected end of formula.');
    if (t.t === 'num') return { t: 'num', v: t.v };
    if (t.t === 'name') {
      if (t.n === 'x') return { t: 'x' };
      if (t.n === 'y') return { t: 'y' };
      const nx = peek();
      if (nx && nx.t === 'op' && nx.o === '(') {
        next();
        const inner = expr();
        const close = next();
        if (!close || close.t !== 'op' || close.o !== ')') throw new Error('Missing closing parenthesis.');
        const name = t.n === 'ln' ? 'log' : t.n;
        if (FUNCTIONS.indexOf(name) === -1) throw new Error("Unknown function '" + t.n + "'.");
        return { t: 'f', n: name, a: inner };
      }
      if (t.n === 'e' || t.n === 'pi') return { t: 'sym', n: t.n };
      throw new Error("Unknown symbol '" + t.n + "'.");
    }
    if (t.t === 'op' && t.o === '(') {
      const inner = expr();
      const close = next();
      if (!close || close.t !== 'op' || close.o !== ')') throw new Error('Missing closing parenthesis.');
      return inner;
    }
    throw new Error('Unexpected "' + t.o + '".');
  }
  return expr();
}

function parseExpr(s) {
  const r = exprTokenize(s);
  if (r.error) return { error: r.error };
  try { return { node: parseExprTokens(r.tokens) }; }
  catch (e) { return { error: e.message }; }
}

// Return {a, b} with node ≡ a·y + b (a null = no y term). Throws NONLINEAR
// when y appears squared / in a denominator / exponent — callers fall back to
// the polynomial solver (preserving its error messages). Throws an Error for
// definitively unsolvable shapes (y inside a function).
const NONLINEAR = {};

function linearize(node) {
  switch (node.t) {
    case 'num': case 'sym': case 'x': return { a: null, b: node };
    case 'y': return { a: { t: 'num', v: 1 }, b: { t: 'num', v: 0 } };
    case 'neg': {
      const r = linearize(node.a);
      return { a: r.a ? { t: 'neg', a: r.a } : null, b: { t: 'neg', a: r.b } };
    }
    case 'f': {
      const r = linearize(node.a);
      if (r.a) throw new Error("Cannot solve — 'y' appears inside a function.");
      return { a: null, b: { t: 'f', n: node.n, a: r.b } };
    }
    case 'pow': {
      const al = linearize(node.l), ar = linearize(node.r);
      if (al.a || ar.a) throw NONLINEAR;
      return { a: null, b: { t: 'pow', l: node.l, r: node.r } };
    }
    case 'b': {
      const op = node.op;
      const al = linearize(node.l), ar = linearize(node.r);
      if (op === '+') return { a: addA(al.a, ar.a), b: { t: 'b', op: '+', l: al.b, r: ar.b } };
      if (op === '-') return { a: subA(al.a, ar.a), b: { t: 'b', op: '-', l: al.b, r: ar.b } };
      if (op === '*') {
        if (al.a && ar.a) throw NONLINEAR;
        if (al.a) return { a: { t: 'b', op: '*', l: al.a, r: ar.b }, b: { t: 'b', op: '*', l: al.b, r: ar.b } };
        if (ar.a) return { a: { t: 'b', op: '*', l: al.b, r: ar.a }, b: { t: 'b', op: '*', l: al.b, r: ar.b } };
        return { a: null, b: { t: 'b', op: '*', l: al.b, r: ar.b } };
      }
      if (op === '/') {
        if (ar.a) throw NONLINEAR;
        if (al.a) return { a: { t: 'b', op: '/', l: al.a, r: ar.b }, b: { t: 'b', op: '/', l: al.b, r: ar.b } };
        return { a: null, b: { t: 'b', op: '/', l: al.b, r: ar.b } };
      }
    }
  }
  throw new Error('Internal solver error.');
}

function addA(a, b) {
  if (!a && !b) return null;
  if (!a) return b;
  if (!b) return a;
  return { t: 'b', op: '+', l: a, r: b };
}
function subA(a, b) {
  if (!a && !b) return null;
  if (!a) return { t: 'neg', a: b };
  if (!b) return a;
  return { t: 'b', op: '-', l: a, r: b };
}

// Constant folding + identity elimination (x*1, x+0, 0*x, ...).
function simplify(node) {
  switch (node.t) {
    case 'num': case 'sym': case 'x': case 'y': return node;
    case 'neg': {
      const c = simplify(node.a);
      if (c.t === 'num') return { t: 'num', v: -c.v };
      if (c.t === 'neg') return c.a;
      return { t: 'neg', a: c };
    }
    case 'f': return { t: 'f', n: node.n, a: simplify(node.a) };
    case 'pow': {
      const l = simplify(node.l), r = simplify(node.r);
      if (l.t === 'num' && r.t === 'num') {
        const v = Math.pow(l.v, r.v);
        if (isFinite(v)) return { t: 'num', v: v };
        return { t: 'pow', l: l, r: r };
      }
      if (r.t === 'num') {
        if (r.v === 1) return l;
        if (r.v === 0) return { t: 'num', v: 1 };
      }
      return { t: 'pow', l: l, r: r };
    }
    case 'b': {
      const op = node.op;
      const l = simplify(node.l), r = simplify(node.r);
      if (op === '+') {
        if (l.t === 'num' && l.v === 0) return r;
        if (r.t === 'num' && r.v === 0) return l;
        if (l.t === 'num' && r.t === 'num') return { t: 'num', v: l.v + r.v };
        return { t: 'b', op: '+', l: l, r: r };
      }
      if (op === '-') {
        if (r.t === 'num' && r.v === 0) return l;
        if (l.t === 'num' && r.t === 'num') return { t: 'num', v: l.v - r.v };
        return { t: 'b', op: '-', l: l, r: r };
      }
      if (op === '*') {
        if (l.t === 'num' && l.v === 0) return { t: 'num', v: 0 };
        if (r.t === 'num' && r.v === 0) return { t: 'num', v: 0 };
        if (l.t === 'num' && l.v === 1) return r;
        if (r.t === 'num' && r.v === 1) return l;
        if (l.t === 'num' && r.t === 'num') return { t: 'num', v: l.v * r.v };
        if (l.t === 'num' && l.v === -1) return { t: 'neg', a: r };
        if (r.t === 'num' && r.v === -1) return { t: 'neg', a: l };
        return { t: 'b', op: '*', l: l, r: r };
      }
      if (op === '/') {
        if (l.t === 'num' && l.v === 0) return { t: 'num', v: 0 };
        if (r.t === 'num' && r.v === 1) return l;
        if (l.t === 'num' && r.t === 'num') {
          if (r.v === 0) return { t: 'b', op: '/', l: l, r: r };
          return { t: 'num', v: l.v / r.v };
        }
        return { t: 'b', op: '/', l: l, r: r };
      }
    }
  }
  return node;
}

function prec(node) {
  switch (node.t) {
    case 'num': case 'sym': case 'x': case 'y': case 'f': return 4;
    case 'neg': case 'pow': return 3;
    case 'b': return (node.op === '*' || node.op === '/') ? 2 : 1;
  }
  return 0;
}

// Render an AST back to a compact expression (uses U+2212 minus).
function astStr(node) {
  switch (node.t) {
    case 'num': return fmt(node.v);
    case 'sym': return node.n;
    case 'x': return 'x';
    case 'f': return node.n + '(' + astStr(node.a) + ')';
    case 'neg': {
      const inner = astStr(node.a);
      return (node.a.t === 'b' || node.a.t === 'neg') ? '\u2212(' + inner + ')' : '\u2212' + inner;
    }
    case 'pow': {
      let bs = astStr(node.l), es = astStr(node.r);
      if (node.l.t === 'b' || node.l.t === 'neg') bs = '(' + bs + ')';
      if (node.r.t === 'b' || node.r.t === 'neg' || node.r.t === 'pow') es = '(' + es + ')';
      return bs + '^' + es;
    }
    case 'b': {
      const op = node.op;
      let ls = astStr(node.l), rs = astStr(node.r);
      if (op === '+' || op === '-') {
        if (prec(node.l) < 1) ls = '(' + ls + ')';
        if (prec(node.r) < 1 || node.r.t === 'neg') rs = '(' + rs + ')';
        return ls + (op === '+' ? ' + ' : ' \u2212 ') + rs;
      }
      if (op === '*') {
        if (prec(node.l) < 2) ls = '(' + ls + ')';
        if (prec(node.r) < 2) rs = '(' + rs + ')';
        if (node.r.t === 'num' || node.r.t === 'sym' || node.l.t === 'x' || node.l.t === 'y' || node.l.t === 'sym') {
          return ls + ' * ' + rs;
        }
        return ls + rs;   // "2x", "2sin(x)", "sin(x)cos(x)"
      }
      if (op === '/') {
        if (prec(node.l) < 2) ls = '(' + ls + ')';
        if (prec(node.r) < 2) rs = '(' + rs + ')';
        return ls + ' / ' + rs;
      }
    }
  }
  return '';
}

// Solve an equation linear in y as y = (B_r − B_l)/(A_l − A_r).
// Returns the solution, an {error}, or null when not linear in y.
function solveFunctional(lhsStr, rhsStr) {
  const lp = parseExpr(lhsStr);
  if (lp.error) return { error: lp.error };
  const rp = parseExpr(rhsStr);
  if (rp.error) return { error: rp.error };
  let la, lb, ra, rb;
  try {
    const l = linearize(lp.node);
    const r = linearize(rp.node);
    la = l.a; lb = l.b; ra = r.a; rb = r.b;
  } catch (e) {
    if (e === NONLINEAR) return null;   // fall back to the polynomial solver
    return { error: e.message };
  }
  let aTot = simplify(subA(la, ra));          // y coefficient
  let expr = simplify({ t: 'b', op: '-', l: rb, r: lb });  // R(x)
  if (!aTot || (aTot.t === 'num' && aTot.v === 0)) {
    return { error: 'Equation has no effective y term — cannot solve for y.' };
  }
  if (aTot.t === 'num' && aTot.v < 0) { aTot = { t: 'num', v: -aTot.v }; expr = { t: 'neg', a: expr }; }
  else if (aTot.t === 'neg' && aTot.a.t === 'num') { aTot = { t: 'num', v: -aTot.a.v }; expr = { t: 'neg', a: expr }; }

  const eStr = astStr(expr);
  let display;
  if (aTot.t === 'num' && aTot.v === 1) {
    display = 'y = ' + eStr;
  } else {
    const body = expr.t === 'b' ? '(' + eStr + ')' : eStr;
    display = 'y = ' + body + ' / ' + astStr(aTot);
  }
  return { kind: 'function', expr: expr, b: aTot, display: display };
}

// Solve "expr = expr" (or bare "expr", treated as y = expr) for y in terms of x.
// Linear in y -> { kind:'linear', a:0, b, denom, poly, display }
// Quadratic in y (a·y² + b·y = R(x)) -> { kind:'quadratic', a, b, poly, display }
// y = f(x) with functions/parens -> { kind:'function', expr, b, display }
// Returns { error } on failure.
function solveEquation(raw) {
  let s = String(raw).replace(/\s+/g, '').replace(/\u2212/g, '-');
  if (!s) return { error: 'Enter a formula first.' };

  let lhsStr, rhsStr;
  const eq = s.indexOf('=');
  if (eq === -1) { lhsStr = 'y'; rhsStr = s; }
  else {
    if (s.indexOf('=', eq + 1) !== -1) return { error: 'Only one "=" allowed.' };
    lhsStr = s.slice(0, eq);
    rhsStr = s.slice(eq + 1);
  }
  if (!lhsStr || !rhsStr) return { error: 'Both sides of "=" must have content.' };

  if (FUNC_RE.test(s)) {
    const r = solveFunctional(lhsStr, rhsStr);
    if (r) return r;
  }
  return solvePolynomial(lhsStr, rhsStr);
}

function solvePolynomial(lhsStr, rhsStr) {
  if (/[()]/.test(lhsStr + rhsStr)) return { error: 'Parentheses are not supported yet.' };

  const lhs = parseSide(lhsStr); if (lhs.error) return lhs;
  const rhs = parseSide(rhsStr); if (rhs.error) return rhs;

  // Normalise to:  a·y² + b·y = R(x)
  let a = lhs.y2Coeff - rhs.y2Coeff;
  let b = lhs.yCoeff - rhs.yCoeff;
  const poly = {};
  for (const e of new Set([...Object.keys(lhs.xTerms), ...Object.keys(rhs.xTerms)].map(Number))) {
    const c = (rhs.xTerms[e] || 0) - (lhs.xTerms[e] || 0);
    if (c !== 0) poly[e] = c;
  }
  const c0 = rhs.const - lhs.const;
  if (c0 !== 0) poly[0] = (poly[0] || 0) + c0;

  if (a !== 0) {
    if (a < 0) { a = -a; b = -b; for (const e of Object.keys(poly)) poly[e] = -poly[e]; }
    if (b === 0) {
      // y² = R/a  →  y = ±√(R/a)
      const rb = polyStr(poly);
      const display = (a === 1)
        ? 'y = \u00b1\u221a(' + rb + ')'
        : 'y = \u00b1\u221a((' + rb + ') / ' + fmt(a) + ')';
      return { kind: 'quadratic', a: a, b: 0, poly: poly, display: display };
    }
    // y = (−b ± √(b² + 4aR)) / (2a)
    let dStr;
    if (Object.keys(poly).length === 0) dStr = fmt(b * b);
    else {
      let rDisp = polyStr(poly);
      const mult = fmt(4 * a);
      if (Object.keys(poly).length > 1 || rDisp.charAt(0) === '\u2212') {
        dStr = fmt(b * b) + ' + ' + mult + '\u00b7(' + rDisp + ')';
      } else {
        dStr = fmt(b * b) + ' + ' + mult + rDisp;
      }
    }
    const negB = -b;
    const num = (negB < 0 ? '\u2212' + fmt(-negB) : fmt(negB)) + ' \u00b1 \u221a(' + dStr + ')';
    const denom = fmt(2 * a);
    const display = (denom === '1') ? ('y = ' + num) : ('y = (' + num + ') / ' + denom);
    return { kind: 'quadratic', a: a, b: b, poly: poly, display: display };
  }

  // Linear: b·y = R(x)
  if (b === 0) return { error: 'Equation has no effective y term — cannot solve for y.' };
  if (b < 0) { b = -b; for (const e of Object.keys(poly)) poly[e] = -poly[e]; }
  const rb = polyStr(poly);
  const display = (b === 1) ? ('y = ' + rb) : ('y = (' + rb + ') / ' + fmt(b));
  return { kind: 'linear', a: 0, b: b, denom: b, poly: poly, display: display };
}

function evalPoly(poly, x) {
  let s = 0;
  for (const e in poly) s += poly[e] * Math.pow(x, Number(e));
  return s;
}

function evalAst(node, x) {
  switch (node.t) {
    case 'num': return node.v;
    case 'sym': return node.n === 'e' ? Math.E : Math.PI;
    case 'x': return x;
    case 'neg': return -evalAst(node.a, x);
    case 'f': {
      const v = evalAst(node.a, x);
      switch (node.n) {
        case 'sin': return Math.sin(v);
        case 'cos': return Math.cos(v);
        case 'tan': return Math.tan(v);
        case 'log': return Math.log(v);
        case 'sqrt': return Math.sqrt(v);
        case 'exp': return Math.exp(v);
        case 'abs': return Math.abs(v);
      }
      throw new Error('unknown function');
    }
    case 'b': {
      const l = evalAst(node.l, x), r = evalAst(node.r, x);
      switch (node.op) {
        case '+': return l + r;
        case '-': return l - r;
        case '*': return l * r;
        case '/': return l / r;
      }
      throw new Error('unknown op');
    }
    case 'pow': return Math.pow(evalAst(node.l, x), evalAst(node.r, x));
    case 'y': throw new Error('internal y');
  }
  throw new Error('unknown node');
}

function discriminant(sol, x) {
  return sol.b * sol.b + 4 * sol.a * evalPoly(sol.poly, x);
}

// Default x range: linear/function -> 1..100; quadratic -> domain of real y.
function autoRange(sol) {
  if (sol.kind !== 'quadratic') return { min: 1, max: 100 };
  const d = x => discriminant(sol, x);
  let anchor = 0;
  if (d(0) < 0) {
    let found = false;
    for (let x = 1; x <= 10000; x++) {
      if (d(x) >= 0) { anchor = x; found = true; break; }
      if (d(-x) >= 0) { anchor = -x; found = true; break; }
    }
    if (!found) return { min: 0, max: 0 };
  }
  const scan = step => {
    let x = anchor;
    while (Math.abs(x) <= 10000) {
      if (d(x) < 0) return x - step;
      x += step;
    }
    return null;
  };
  let right = scan(1), left = scan(-1);
  if (right === null && left === null) return { min: -100, max: 100 };
  if (right === null) right = left + 200;
  if (left === null) left = right - 200;
  return { min: left, max: right };
}

// Build branch points for a solution. Returns { xRange, step, branches } or { error }.
function buildBranches(sol, xMin, xMax, xStep) {
  if ((xMin === undefined) !== (xMax === undefined)) {
    return { error: 'Provide both x_min and x_max, or neither.' };
  }
  let lo = xMin, hi = xMax;
  if (lo === undefined || hi === undefined) {
    const r = autoRange(sol);
    lo = r.min; hi = r.max;
  }
  let step;
  if (xStep !== undefined) {
    if (xStep < 1 || xStep > 1000) return { error: 'x_step must be between 1 and 1000.' };
    step = xStep;
  } else {
    step = 1;
    if (sol.kind === 'quadratic' && (xMin === undefined || xMax === undefined) && (hi - lo) > 400) {
      step = Math.ceil((hi - lo) / 400);
    }
  }
  if (Math.floor((hi - lo) / step) + 1 > 5000) {
    return { error: 'Range too large (max 5000 points) — increase the step.' };
  }
  if (sol.kind === 'linear') {
    const pts = [];
    for (let x = lo; x <= hi; x += step) {
      const y = evalPoly(sol.poly, x) / sol.b;
      if (!isFinite(y)) return { error: 'Result overflows at x = ' + x + ' — exponents too large?' };
      pts.push({ x: x, y: y });
    }
    return { xRange: { min: lo, max: hi }, step: step, branches: [{ label: '', points: pts }] };
  }
  if (sol.kind === 'function') {
    // y = f(x): skip domain holes (log/sqrt of negatives, division by zero)
    // and asymptote blow-ups; each contiguous run becomes its own segment.
    const segments = [];
    let cur = [];
    for (let x = lo; x <= hi; x += step) {
      const num = evalAst(sol.expr, x);
      const den = evalAst(sol.b, x);
      const y = num / den;
      if (!isFinite(y) || Math.abs(y) > FUNCTION_Y_LIMIT) {
        if (cur.length) { segments.push(cur); cur = []; }
        continue;
      }
      cur.push({ x: x, y: y });
    }
    if (cur.length) segments.push(cur);
    if (!segments.length) return { error: 'No real y for the given x range.' };
    return {
      xRange: { min: lo, max: hi },
      step: step,
      branches: segments.map(seg => ({ label: '', points: seg })),
    };
  }
  const plus = [], minus = [];
  for (let x = lo; x <= hi; x += step) {
    const d = discriminant(sol, x);
    if (d < 0) continue;
    if (!isFinite(d)) return { error: 'Result overflows at x = ' + x + ' — exponents too large?' };
    const root = Math.sqrt(d);
    const y1 = (-sol.b + root) / (2 * sol.a);
    const y2 = (-sol.b - root) / (2 * sol.a);
    if (!isFinite(y1) || !isFinite(y2)) return { error: 'Result overflows at x = ' + x + ' — exponents too large?' };
    plus.push({ x: x, y: y1 });
    minus.push({ x: x, y: y2 });   // tangency points (root === 0) belong to both branches
  }
  if (!plus.length && !minus.length) return { error: 'No real y for the given x range.' };
  return {
    xRange: { min: lo, max: hi },
    step: step,
    branches: [{ label: '+', points: plus }, { label: '\u2212', points: minus }],
  };
}

/* ================= drawing (with pan/zoom view) ================= */

const PALETTES = {
  light: { grid: '#e2e8f0', axis: '#0f172a', ticks: '#64748b', labels: '#0f172a' },
  dark: { grid: '#334155', axis: '#e2e8f0', ticks: '#94a3b8', labels: '#e2e8f0' },
};
let view = null;        // {cx, cy, unit} — pixel pos of data origin, px per unit
let lastBranches = null;
let gridOn = true;

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function palette() { return currentTheme() === 'dark' ? PALETTES.dark : PALETTES.light; }

function redraw() { if (lastBranches) draw(lastBranches); }

function draw(branches) {
  const cv = document.getElementById('graph');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const pal = palette();
  ctx.clearRect(0, 0, W, H);

  const all = [];
  branches.forEach(br => { for (const p of br.points) all.push(p); });
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);

  // Auto-scale so the whole data range fits, origin pinned to canvas centre.
  // Only used for the first draw of each plot; pan/zoom then take over.
  if (!view) {
    const halfX = niceCeil(Math.max(Math.abs(xMin), Math.abs(xMax), 1));
    const halfY = niceCeil(Math.max(Math.abs(yMin), Math.abs(yMax), 1));
    const pad = 64;
    view = {
      cx: W / 2,
      cy: H / 2,
      unit: Math.min((W / 2 - pad) / halfX, (H / 2 - pad) / halfY),
    };
  }
  const cx = view.cx, cy = view.cy, unit = view.unit;
  const X = v => cx + v * unit;
  const Y = v => cy - v * unit;

  const stepX = niceCeil(55 / unit), stepY = niceCeil(55 / unit);
  const visX = Math.ceil((W / 2) / unit), visY = Math.ceil((H / 2) / unit);
  ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';

  // Grid
  if (gridOn) {
    ctx.strokeStyle = pal.grid; ctx.lineWidth = 1;
    for (let g = -visX; g <= visX; g += stepX) {
      const px = X(g); if (px < 0 || px > W) continue;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
    }
    for (let g = -visY; g <= visY; g += stepY) {
      const py = Y(g); if (py < 0 || py > H) continue;
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
    }
  }

  // Axes through the data origin (skipped when panned off-canvas)
  if (cx >= -8 && cx <= W + 8) {
    ctx.strokeStyle = pal.axis; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W - 8, cy); ctx.stroke();
    ctx.fillStyle = pal.axis;
    ctx.beginPath(); ctx.moveTo(W - 14, cy - 5); ctx.lineTo(W - 8, cy); ctx.lineTo(W - 14, cy + 5); ctx.closePath(); ctx.fill();
  }
  if (cy >= -8 && cy <= H + 8) {
    ctx.strokeStyle = pal.axis; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, H); ctx.lineTo(cx, 8); ctx.stroke();
    ctx.fillStyle = pal.axis;
    ctx.beginPath(); ctx.moveTo(cx - 5, 14); ctx.lineTo(cx, 8); ctx.lineTo(cx + 5, 14); ctx.closePath(); ctx.fill();
  }

  // Tick labels
  ctx.fillStyle = pal.ticks;
  for (let g = -visX; g <= visX; g += stepX) { if (g === 0) continue; ctx.fillText(fmt(g), X(g) + 3, cy + 16); }
  for (let g = -visY; g <= visY; g += stepY) { if (g === 0) continue; ctx.fillText(fmt(g), cx + 6, Y(g) - 4); }
  ctx.fillStyle = pal.labels;
  ctx.fillText('x', W - 20, cy - 10);
  ctx.fillText('y', cx + 12, 18);

  // Line through each branch's points (branch 0 blue, branch 1 teal). The
  // polyline breaks when two consecutive samples jump across a vertical
  // asymptote (tan, 1/x) so no false line is drawn through the wall.
  const colors = ['#2563eb', '#0d9488'];
  branches.forEach((br, bi) => {
    if (!br.points.length) return;
    ctx.strokeStyle = colors[bi % colors.length];
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    let prevX = null, prevY = null;
    for (let i = 0; i < br.points.length; i++) {
      const px = X(br.points[i].x), py = Y(br.points[i].y);
      if (i === 0) { ctx.moveTo(px, py); }
      else if (Math.abs(py - prevY) > H && Math.abs(px - prevX) < 20) { ctx.moveTo(px, py); }
      else { ctx.lineTo(px, py); }
      prevX = px; prevY = py;
    }
    ctx.stroke();

    // Point markers — only when the unit spacing is wide enough that they
    // don't merge into a solid ribbon.
    if (unit >= 6) {
      ctx.fillStyle = colors[bi % colors.length];
      for (const p of br.points) {
        const px = X(p.x), py = Y(p.y);
        if (px < 0 || px > W || py < 0 || py > H) continue;
        ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  });
}

/* ================= canvas interaction: pan / pinch-zoom / wheel / reset ================= */

// All active pointers (touch + mouse) in client coords. Two pointers = pinch
// zoom around their midpoint; one pointer = drag pan; wheel zooms around the
// cursor; double-click resets the view.
let pointers = new Map();   // pointerId -> {id, x, y}
let pan = null;             // single-pointer drag: {id, sx, sy, baseCx, baseCy}
let pinch = null;           // two-pointer zoom baseline: {dist, midX, midY}

function canvasPointerDown(e) {
  if (!view) return;
  pointers.set(e.pointerId, { id: e.pointerId, x: e.clientX, y: e.clientY });
  try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
  e.target.style.cursor = 'grabbing';
  if (pointers.size === 2) {
    pan = null;
    startPinch();
  } else if (pointers.size === 1) {
    pan = { id: e.pointerId, sx: e.clientX, sy: e.clientY, baseCx: view.cx, baseCy: view.cy };
  }
}

function startPinch() {
  const [p1, p2] = [...pointers.values()];
  const rect = document.getElementById('graph').getBoundingClientRect();
  pinch = {
    dist: Math.hypot(p2.x - p1.x, p2.y - p1.y),
    midX: (p1.x + p2.x) / 2 - rect.left,
    midY: (p1.y + p2.y) / 2 - rect.top,
  };
}

function canvasPointerMove(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { id: e.pointerId, x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinch) {
    // Pinch zoom: scale the unit by the finger-distance ratio, keeping the
    // data point under the gesture midpoint fixed (same anchor math as wheel).
    const [p1, p2] = [...pointers.values()];
    const rect = e.target.getBoundingClientRect();
    const midX = (p1.x + p2.x) / 2 - rect.left;
    const midY = (p1.y + p2.y) / 2 - rect.top;
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (pinch.dist > 0 && dist > 0) {
      const unit2 = Math.min(300, Math.max(0.5, view.unit * (dist / pinch.dist)));
      const eff = unit2 / view.unit;
      view.cx = midX - (midX - view.cx) * eff;
      view.cy = midY - (midY - view.cy) * eff;
      view.unit = unit2;
    }
    pinch = { dist: dist, midX: midX, midY: midY };
    redraw();
  } else if (pointers.size === 1 && pan && e.pointerId === pan.id) {
    const dx = e.clientX - pan.sx, dy = e.clientY - pan.sy;
    view.cx = pan.baseCx + dx;
    view.cy = pan.baseCy + dy;
    redraw();
  }
}

function canvasPointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    pan = null;
    pinch = null;
    e.target.style.cursor = 'grab';
  } else if (pointers.size === 1) {
    // One finger still down — continue as a pan from the current (zoomed) view.
    pinch = null;
    const [p] = [...pointers.values()];
    pan = { id: p.id, sx: p.x, sy: p.y, baseCx: view.cx, baseCy: view.cy };
  }
}
function canvasWheel(e) {
  e.preventDefault();
  if (!view) return;
  const rect = e.target.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const unit2 = Math.min(300, Math.max(0.5, view.unit * factor));
  const eff = unit2 / view.unit;
  view.cx = px - (px - view.cx) * eff;
  view.cy = py - (py - view.cy) * eff;
  view.unit = unit2;
  redraw();
}
function canvasDblClick() { view = null; redraw(); }

/* ================= UI ================= */

function renderTable(branches) {
  const tb = document.getElementById('points');
  const hasLabels = branches.some(br => br.label !== '');
  if (!hasLabels) {
    const pts = [];
    branches.forEach(br => { for (const p of br.points) pts.push(p); });
    tb.innerHTML = pts.map(p => '<tr><td>' + p.x + '</td><td>' + fmt(p.y) + '</td></tr>').join('');
    return;
  }
  let html = '';
  for (const br of branches) {
    html += '<tr class="branch-hdr"><td colspan="2">branch ' + br.label + '</td></tr>';
    html += br.points
      .map(p => '<tr><td>' + p.x + '</td><td>' + fmt(p.y) + '</td></tr>').join('');
  }
  tb.innerHTML = html;
}

// Render any error value as readable text — never "[object Object]".
function errorText(msg) {
  if (typeof msg === 'string') return msg;
  if (msg && typeof msg === 'object') {
    try { return JSON.stringify(msg); } catch (e) { /* fall through */ }
  }
  return String(msg);
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = errorText(msg);
  el.style.display = 'block';
}

// Safety net: surface any uncaught script error in the error box so problems
// are reported with their real message instead of failing silently.
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('error', function (e) {
    showError('Script error: ' + ((e && e.message) ? e.message : 'unknown'));
  });
}

function clearError() {
  document.getElementById('error').style.display = 'none';
}

// Guards against out-of-order responses when the user plots quickly.
let plotSeq = 0;

function exportPng() {
  const cv = document.getElementById('graph');
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'xy-graph.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function copyLink() {
  const url = location.href;
  const flash = () => {
    const btn = document.getElementById('copyBtn');
    const old = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = old; }, 1500);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
    flash();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(flash, fallback);
  } else {
    fallback();
  }
}

// Collect the current formula + range inputs into a query string.
function rangeParams(raw) {
  const v = id => document.getElementById(id).value.trim();
  const p = new URLSearchParams();
  p.set('formula', raw);
  const xMin = v('xMin'), xMax = v('xMax'), xStep = v('xStep');
  if (xMin !== '') p.set('x_min', xMin);
  if (xMax !== '') p.set('x_max', xMax);
  if (xStep !== '') p.set('x_step', xStep);
  return p;
}

async function plot(raw) {
  const seq = ++plotSeq;
  let data = null, errMsg = null;
  const qp = rangeParams(raw);
  // Keep the query string in sync with the input immediately on click, so the
  // URL always reproduces what was typed (works even when the plot errors).
  try { history.replaceState(null, '', '?' + qp.toString()); } catch (e) {}

  // Prefer the server-side solver; fall back to the built-in one if the API
  // is unreachable (e.g. page opened from file:// or server down).
  try {
    const res = await fetch('/api/points?' + qp.toString());
    const body = await res.json();
    if (!res.ok) errMsg = (body && body.detail) ? body.detail : ('Server error (' + res.status + ')');
    else data = body;
  } catch (e) {
    data = null;
  }

  if (!data && !errMsg) {
    const sol = solveEquation(raw);
    if (sol.error) { showError(sol.error); document.getElementById('solved').textContent = ''; return; }
    const rv = id => {
      const t = document.getElementById(id).value.trim();
      return t === '' ? undefined : parseInt(t, 10);
    };
    const built = buildBranches(sol, rv('xMin'), rv('xMax'), rv('xStep'));
    if (built.error) { showError(built.error); document.getElementById('solved').textContent = ''; return; }
    data = { display: sol.display, kind: sol.kind, x_range: built.xRange, step: built.step, branches: built.branches };
  }

  if (seq !== plotSeq) return;   // a newer plot superseded this one
  if (errMsg) { showError(errMsg); document.getElementById('solved').textContent = ''; return; }

  clearError();
  const rng = data.x_range;
  const stepNote = (data.step && data.step !== 1) ? (' \u00b7 step ' + data.step) : '';
  const branchNote = data.branches.length > 1 ? (' \u00b7 ' + data.branches.length + ' branches') : '';
  document.getElementById('solved').textContent =
    'Given:  ' + raw.trim() + '    \u2192    ' + errorText(data.display) +
    '    (plotted for x = ' + rng.min + ' \u2026 ' + rng.max + stepNote + branchNote + ')';
  lastBranches = data.branches;
  view = null;
  draw(lastBranches);
  renderTable(data.branches);
  const nPts = data.branches.reduce((n, br) => n + br.points.length, 0);
  document.getElementById('meta').textContent =
    nPts + ' points \u00b7 drag to pan \u00b7 scroll / pinch to zoom \u00b7 double-click to reset';
  pushHistory(raw.trim());
  renderHistory();
}

/* ================= history (localStorage ring buffer) ================= */

const HISTORY_KEY = 'xygh:history';
const HISTORY_MAX = 12;

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(x => typeof x === 'string') : [];
  } catch (e) { return []; }
}
function saveHistory(arr) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); } catch (e) {}
}
function pushHistory(formula) {
  const arr = loadHistory().filter(f => f !== formula);
  arr.unshift(formula);
  saveHistory(arr.slice(0, HISTORY_MAX));
}
function renderHistory() {
  const box = document.getElementById('history');
  const arr = loadHistory();
  box.innerHTML = '';
  if (!arr.length) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  const label = document.createElement('span');
  label.className = 'range-label';
  label.textContent = 'History:';
  box.appendChild(label);
  arr.forEach(function (f) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = f;
    b.title = f;
    b.addEventListener('click', function () {
      document.getElementById('formula').value = f;
      plot(f);
    });
    box.appendChild(b);
  });
  const clear = document.createElement('button');
  clear.type = 'button';
  clear.className = 'chip';
  clear.textContent = '\u2715 clear';
  clear.title = 'Clear history';
  clear.addEventListener('click', function () { saveHistory([]); renderHistory(); });
  box.appendChild(clear);
}

/* ================= theme / grid toggles ================= */

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('xygh:theme', t); } catch (e) {}
  document.getElementById('themeBtn').textContent = t === 'dark' ? '\u2600\ufe0f Light' : '\ud83c\udf19 Dark';
  redraw();
}
function toggleTheme() { applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }
function toggleGrid() {
  gridOn = !gridOn;
  document.getElementById('gridBtn').textContent = gridOn ? 'Grid: on' : 'Grid: off';
  redraw();
}

function init() {
  const form = document.getElementById('form');
  const input = document.getElementById('formula');
  form.addEventListener('submit', function (e) { e.preventDefault(); plot(input.value); });
  document.getElementById('pngBtn').addEventListener('click', exportPng);
  document.getElementById('copyBtn').addEventListener('click', copyLink);
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  document.getElementById('gridBtn').addEventListener('click', toggleGrid);

  const cv = document.getElementById('graph');
  cv.addEventListener('pointerdown', canvasPointerDown);
  cv.addEventListener('pointermove', canvasPointerMove);
  cv.addEventListener('pointerup', canvasPointerUp);
  cv.addEventListener('pointercancel', canvasPointerUp);
  cv.addEventListener('wheel', canvasWheel, { passive: false });
  cv.addEventListener('dblclick', canvasDblClick);

  document.querySelectorAll('#chips .chip').forEach(function (ch) {
    ch.addEventListener('click', function () { input.value = ch.textContent; plot(input.value); });
  });

  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem('xygh:theme') || 'light'; } catch (e) {}
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  renderHistory();
  plot(input.value);
}

if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('DOMContentLoaded', init);
}
</script>
