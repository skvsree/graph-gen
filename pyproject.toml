[project]
name = "xy-graph-gen"
version = "0.2.0"
description = "Formula grapher: FastAPI service that solves an equation for y and plots x = 1..100"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "jinja2",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pillow",       # scripts/make_icons.py (PWA icon/screenshot generation)
    "pytest",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
